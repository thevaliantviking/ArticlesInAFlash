<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Articles in a Flash</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F1D">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --panel-bg:#15181a;
    --card-bg:#20241f;
    --card-bg-2:#262b26;
    --copper:#c97c3d;
    --copper-bright:#e0954f;
    --amber:#e8a93b;
    --circuit-green:#5b8c5a;
    --fault-red:#c2543a;
    --insulation:#ede7da;
    --insulation-dim:#a9a397;
    --line:#3a4038;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--panel-bg);
    color:var(--insulation);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(201,124,61,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(91,140,90,0.05), transparent 40%);
  }

  /* ── Topbar ── */
  .topbar{
    padding:18px 18px 10px 18px;
    border-bottom:1px solid var(--line);
  }
  .topbar.hidden{ display:none; }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .brand-left{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
    flex-wrap:wrap;
  }
  .brand h1{
    font-family:"Arial Black",Impact,"Segoe UI",sans-serif;
    font-weight:900;
    font-size:20px;
    letter-spacing:1.5px;
    margin:0;
    color:var(--copper-bright);
    text-transform:uppercase;
  }
  .brand .tag{
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--insulation-dim);
    letter-spacing:1px;
  }
  .quit-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--insulation-dim);
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px;
    letter-spacing:1px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-left:10px;
    flex-shrink:0;
  }
  .quit-btn:active{ background:var(--card-bg); }

  .breaker-row{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:14px;
  }
  .breaker{
    width:7px;
    height:16px;
    border-radius:1px;
    background:var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
    transition: background 0.25s ease, transform 0.15s ease;
  }
  .breaker.done{ background:var(--copper); }
  .breaker.current{ background:var(--amber); transform:translateY(-2px); }

  .stats-line{
    display:flex;
    gap:16px;
    margin-top:10px;
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--insulation-dim);
  }
  .stats-line b{ color:var(--insulation); }

  /* ── Title Screen ── */
  .title-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 24px;
    text-align:center;
  }
  .title-screen.hidden{ display:none; }
  .title-logo{
    font-family:"Arial Black",Impact,"Segoe UI",sans-serif;
    font-weight:900;
    font-size:32px;
    letter-spacing:2px;
    color:var(--copper-bright);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .title-sub{
    font-family:"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--insulation-dim);
    letter-spacing:1.5px;
    margin-bottom:40px;
  }
  .mode-label{
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--copper);
    letter-spacing:1.5px;
    margin-bottom:14px;
  }
  .mode-btn{
    display:block;
    width:100%;
    max-width:300px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 20px;
    color:var(--insulation);
    font-size:17px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:10px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
  }
  .mode-btn:active{ transform:scale(0.97); }
  .mode-btn:hover{ border-color:var(--copper); }
  .mode-hint{
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px;
    color:var(--insulation-dim);
    margin-top:2px;
    font-weight:400;
  }
  .title-count{
    margin-top:30px;
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--insulation-dim);
  }

  /* ── Flashcard Screen ── */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px 18px 28px 18px;
    max-width:560px;
    width:100%;
    margin:0 auto;
  }
  main.hidden{ display:none; }

  .card-num{
    font-family:"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--copper);
    letter-spacing:1px;
    margin-bottom:10px;
  }
  .card-type-label{
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--insulation-dim);
    margin-bottom:8px;
  }

  /* Flip card container */
  .flip-container{
    perspective:800px;
    margin-bottom:20px;
    cursor:pointer;
  }
  .flip-card{
    position:relative;
    width:100%;
    min-height:180px;
    transition: transform 0.5s ease;
    transform-style:preserve-3d;
  }
  .flip-card.flipped{
    transform:rotateX(180deg);
  }
  .flip-face{
    position:absolute;
    top:0; left:0; right:0;
    min-height:180px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 24px;
    border-radius:14px;
    text-align:center;
  }
  .flip-front{
    background:var(--card-bg);
    border:2px solid var(--line);
  }
  .flip-back{
    background:var(--card-bg-2);
    border:2px solid var(--copper);
    transform:rotateX(180deg);
  }
  .flip-text{
    font-size:22px;
    font-weight:700;
    line-height:1.35;
    color:var(--insulation);
  }
  .flip-back .flip-text{
    color:var(--copper-bright);
  }
  .flip-hint{
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px;
    letter-spacing:1px;
    color:var(--insulation-dim);
    margin-top:14px;
  }
  .flip-back .flip-hint{
    color:var(--insulation-dim);
  }

  .card-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .card-actions.hidden{ display:none; }
  .card-action-btn{
    flex:1;
    padding:14px 12px;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    font-family:inherit;
    transition: transform 0.08s ease;
  }
  .card-action-btn:active{ transform:scale(0.97); }
  .btn-knew{
    background:var(--circuit-green);
    color:#1B1F1D;
    border:none;
  }
  .btn-missed{
    background:var(--fault-red);
    color:#fff;
    border:none;
  }

  /* ── Complete Screen ── */
  .complete-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 24px;
  }
  .complete-screen.hidden{ display:none; }
  .complete-icon{
    font-size:56px;
    margin-bottom:12px;
  }
  .complete-heading{
    font-family:"Arial Black",Impact,"Segoe UI",sans-serif;
    font-weight:900;
    font-size:28px;
    letter-spacing:1px;
    color:var(--copper-bright);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .complete-sub{
    font-family:"SF Mono",Consolas,monospace;
    font-size:13px;
    color:var(--insulation-dim);
    margin-bottom:6px;
    line-height:1.5;
  }
  .complete-stats{
    display:flex;
    gap:24px;
    margin:24px 0 30px 0;
  }
  .cstat{
    text-align:center;
  }
  .cstat-num{
    font-family:"SF Mono",Consolas,monospace;
    font-size:28px;
    font-weight:700;
  }
  .cstat-num.g{ color:var(--circuit-green); }
  .cstat-num.r{ color:var(--fault-red); }
  .cstat-label{
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px;
    letter-spacing:1px;
    color:var(--insulation-dim);
    margin-top:4px;
  }
  .home-btn{
    background:var(--copper);
    color:#1B1F1D;
    border:none;
    border-radius:8px;
    padding:14px 32px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    font-family:inherit;
    transition: transform 0.08s ease;
  }
  .home-btn:active{ transform:scale(0.97); }

  .footer-note{
    text-align:center;
    font-size:10px;
    color:var(--insulation-dim);
    padding:10px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<!-- ── Topbar (hidden on title) ── -->
<div class="topbar hidden" id="topbar">
  <div class="brand">
    <div class="brand-left">
      <h1>Articles in a Flash</h1>
      <span class="tag" id="modeTag">SUBJECTS</span>
    </div>
    <button class="quit-btn" id="quitBtn">QUIT</button>
  </div>
  <div class="breaker-row" id="breakerRow"></div>
  <div class="stats-line">
    <span>KNEW IT <b id="statKnew">0</b></span>
    <span>MISSED <b id="statMissed">0</b></span>
    <span>LEFT <b id="statLeft">0</b></span>
  </div>
</div>

<!-- ── Title Screen ── -->
<div class="title-screen" id="titleScreen">
  <div class="title-logo">Articles in a Flash</div>
  <div class="title-sub">NEC ARTICLE FLASHCARDS</div>
  <div class="mode-label">SELECT MODE</div>
  <button class="mode-btn" onclick="startRound('subjects')">
    Subjects
    <div class="mode-hint">See the subject — name the article</div>
  </button>
  <button class="mode-btn" onclick="startRound('articles')">
    Articles
    <div class="mode-hint">See the article — name the subject</div>
  </button>
  <button class="mode-btn" onclick="startRound('mixed')">
    Mixed
    <div class="mode-hint">Random side shown first</div>
  </button>
  <div class="title-count" id="titleCount"></div>
</div>

<!-- ── Flashcard Screen ── -->
<main class="hidden" id="cardScreen">
  <div class="card-num" id="cardNum">CARD 1 OF 65</div>
  <div class="card-type-label" id="cardTypeLabel">SUBJECT</div>
  <div class="flip-container" id="flipContainer">
    <div class="flip-card" id="flipCard">
      <div class="flip-face flip-front">
        <div class="flip-text" id="frontText">Loading...</div>
        <div class="flip-hint">TAP TO FLIP</div>
      </div>
      <div class="flip-face flip-back">
        <div class="flip-text" id="backText">...</div>
        <div class="flip-hint">DID YOU KNOW IT?</div>
      </div>
    </div>
  </div>
  <div class="card-actions hidden" id="cardActions">
    <button class="card-action-btn btn-knew" id="btnKnew">KNEW IT</button>
    <button class="card-action-btn btn-missed" id="btnMissed">MISSED IT</button>
  </div>
</main>

<!-- ── Complete Screen ── -->
<div class="complete-screen hidden" id="completeScreen">
  <div class="complete-icon">⚡</div>
  <div class="complete-heading">Complete</div>
  <div class="complete-sub" id="completeSub">All cards reviewed.</div>
  <div class="complete-stats">
    <div class="cstat"><div class="cstat-num g" id="cKnew">0</div><div class="cstat-label">KNEW IT</div></div>
    <div class="cstat"><div class="cstat-num r" id="cMissed">0</div><div class="cstat-label">MISSED</div></div>
    <div class="cstat"><div class="cstat-num" id="cTotal">0</div><div class="cstat-label">CARDS</div></div>
  </div>
  <button class="home-btn" id="homeBtn">BACK TO MENU</button>
</div>

<div class="footer-note">Each card appears once per round — no repeats.</div>

<script>
const CARDS = [{"subject": "Conductor Properties", "article": "Chapter 9 Table 8"}, {"subject": "Raceways", "article": "342-392"}, {"subject": "Mobile Homes", "article": "550"}, {"subject": "Switches", "article": "404"}, {"subject": "Commercial Garages", "article": "511"}, {"subject": "Bulk Storage Plants", "article": "515"}, {"subject": "Heath Care Facilities", "article": "517"}, {"subject": "Cable Types", "article": "320-340"}, {"subject": "Fire Resistant Cables", "article": "728"}, {"subject": "Electric Signs", "article": "600"}, {"subject": "Assembly Occupancies", "article": "518"}, {"subject": "Class 4 Circuits", "article": "726"}, {"subject": "Required Standby Systems", "article": "701"}, {"subject": "Aircraft Hangers", "article": "513"}, {"subject": "Surge Arresters", "article": "242 Part III"}, {"subject": "Motor Fuel Dispensing Facility Locations", "article": "514"}, {"subject": "Services", "article": "230"}, {"subject": "Motors", "article": "430"}, {"subject": "Optic Fiber Cables  And Raceways", "article": "770"}, {"subject": "Class 1/Class 2/Class 3  Power Limited Circuits", "article": "724, 725"}, {"subject": "Solar Photovoltaic (PV) Systems", "article": "690"}, {"subject": "Fixed Electric Space  Heating Equipment", "article": "424"}, {"subject": "Overvoltage Protection", "article": "242"}, {"subject": "Generators", "article": "445"}, {"subject": "Panelboards / Switchgear", "article": "408"}, {"subject": "Office Furnishings  (Office Partisans)", "article": "605"}, {"subject": "NFPA Documentation", "article": "500"}, {"subject": "Branch Circuit, Feeder, and  Service Load Calculations", "article": "220"}, {"subject": "Knob and Tube Wiring", "article": "394"}, {"subject": "AC and Refrigerating Equipment", "article": "440"}, {"subject": "Emergency Systems", "article": "700"}, {"subject": "Recreational Vehicles", "article": "551"}, {"subject": "Optional Standby Systems", "article": "702"}, {"subject": "Marinas and Boatyards", "article": "555"}, {"subject": "Edison Based Fuses", "article": "240"}, {"subject": "Required Outlets for Dwellings", "article": "210 Part III"}, {"subject": "Pipe Fill", "article": "Chapter 9  Table 1, Table 4"}, {"subject": "Electric Vehicle Charging Station", "article": "625"}, {"subject": "Grounding and Bonding", "article": "250"}, {"subject": "Surge Protection Devices (SPDS)", "article": "242  Part II"}, {"subject": "Flexible Cords", "article": "400"}, {"subject": "Service/Branch Circuits Over  1000VAC, 1500VDC", "article": "235"}, {"subject": "Fixed Outdoor Electric  Deicing and Snowmelting", "article": "426"}, {"subject": "Fire Pump Motors", "article": "695"}, {"subject": "Spray Application for  Combustible Materials", "article": "516"}, {"subject": "Outside Branch  Circuits/Feeders", "article": "225"}, {"subject": "Tamper-proof Receptacles", "article": "406"}, {"subject": "Transformers", "article": "450"}, {"subject": "Fire Alarm Systems", "article": "760"}, {"subject": "Appliances", "article": "422"}, {"subject": "X-Ray Equipment", "article": "660"}, {"subject": "Medium Voltage (MV)", "article": "315"}, {"subject": "Swimming Pools", "article": "680"}, {"subject": "Overcurrent Protection", "article": "240"}, {"subject": "Hazardous Locations", "article": "500"}, {"subject": "Buseways", "article": "368"}, {"subject": "Capacitors", "article": "460"}, {"subject": "Electric Welders", "article": "630"}, {"subject": "General Requirements for Wiring  And Materials over 1000VAC, 1500VDC", "article": "305"}, {"subject": "Low Voltage Suspending PDS  (Power Down Suspension)", "article": "393"}, {"subject": "Small Wind Electric (Turbine)  Systems", "article": "694"}, {"subject": "Working Space Clearances", "article": "110"}, {"subject": "Luminaries, Lamp Holders,  And Lamps", "article": "410"}, {"subject": "Fixture Wires", "article": "402"}, {"subject": "Circuit Breakers", "article": "240  Part VII"}];

let mode = 'subjects';
let order = [];
let pos = 0;
let knewCount = 0;
let missedCount = 0;
let isFlipped = false;

const topbar = document.getElementById('topbar');
const titleScreen = document.getElementById('titleScreen');
const cardScreen = document.getElementById('cardScreen');
const completeScreen = document.getElementById('completeScreen');
const modeTag = document.getElementById('modeTag');
const breakerRow = document.getElementById('breakerRow');
const statKnew = document.getElementById('statKnew');
const statMissed = document.getElementById('statMissed');
const statLeft = document.getElementById('statLeft');
const cardNum = document.getElementById('cardNum');
const cardTypeLabel = document.getElementById('cardTypeLabel');
const flipContainer = document.getElementById('flipContainer');
const flipCard = document.getElementById('flipCard');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const cardActions = document.getElementById('cardActions');

document.getElementById('titleCount').textContent = CARDS.length + ' cards in the deck';

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function showScreen(name){
  titleScreen.classList.toggle('hidden', name!=='title');
  cardScreen.classList.toggle('hidden', name!=='card');
  completeScreen.classList.toggle('hidden', name!=='complete');
  topbar.classList.toggle('hidden', name==='title');
}

function startRound(m){
  mode = m;
  order = shuffle(CARDS.map((_,i)=>i));
  pos = 0;
  knewCount = 0;
  missedCount = 0;
  modeTag.textContent = mode.toUpperCase();
  buildBreakers();
  showScreen('card');
  renderCard();
  updateStats();
}

function buildBreakers(){
  breakerRow.innerHTML='';
  for(let i=0;i<order.length;i++){
    const d=document.createElement('div');
    d.className='breaker';
    d.id='brk-'+i;
    breakerRow.appendChild(d);
  }
}

function updateBreakers(){
  for(let i=0;i<order.length;i++){
    const el=document.getElementById('brk-'+i);
    el.classList.remove('current','done');
    if(i<pos) el.classList.add('done');
    else if(i===pos) el.classList.add('current');
  }
}

function updateStats(){
  statKnew.textContent = knewCount;
  statMissed.textContent = missedCount;
  statLeft.textContent = order.length - pos;
}

function renderCard(){
  const c = CARDS[order[pos]];
  isFlipped = false;
  flipCard.classList.remove('flipped');
  cardActions.classList.add('hidden');

  cardNum.textContent = 'CARD ' + (pos+1) + ' OF ' + order.length;

  let showSubjectFirst;
  if(mode==='subjects') showSubjectFirst = true;
  else if(mode==='articles') showSubjectFirst = false;
  else showSubjectFirst = Math.random() < 0.5;

  if(showSubjectFirst){
    cardTypeLabel.textContent = 'SUBJECT';
    frontText.textContent = c.subject;
    backText.textContent = c.article;
  } else {
    cardTypeLabel.textContent = 'ARTICLE';
    frontText.textContent = c.article;
    backText.textContent = c.subject;
  }

  // Match back face height to front
  syncCardHeight();
  updateBreakers();
  updateStats();
}

function syncCardHeight(){
  const front = flipCard.querySelector('.flip-front');
  const back = flipCard.querySelector('.flip-back');
  // Reset
  front.style.position = 'relative';
  back.style.position = 'relative';
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.offsetHeight, back.offsetHeight);
  front.style.height = h + 'px';
  back.style.height = h + 'px';
  front.style.position = 'absolute';
  back.style.position = 'absolute';
  flipCard.style.height = h + 'px';
}

flipContainer.addEventListener('click', function(){
  if(isFlipped) return;
  isFlipped = true;
  flipCard.classList.add('flipped');
  cardActions.classList.remove('hidden');
});

document.getElementById('btnKnew').addEventListener('click', function(){
  knewCount++;
  advance();
});

document.getElementById('btnMissed').addEventListener('click', function(){
  missedCount++;
  advance();
});

function advance(){
  pos++;
  updateStats();
  if(pos >= order.length){
    showComplete();
  } else {
    renderCard();
  }
}

function showComplete(){
  showScreen('complete');
  document.getElementById('cKnew').textContent = knewCount;
  document.getElementById('cMissed').textContent = missedCount;
  document.getElementById('cTotal').textContent = knewCount + missedCount;
  const sub = document.getElementById('completeSub');
  if(knewCount === order.length){
    sub.textContent = 'Perfect round — every card nailed.';
  } else if(knewCount >= order.length * 0.8){
    sub.textContent = 'Strong run. A few to brush up on.';
  } else {
    sub.textContent = 'Keep at it — repetition is the circuit to mastery.';
  }
}

document.getElementById('homeBtn').addEventListener('click', function(){
  showScreen('title');
});

document.getElementById('quitBtn').addEventListener('click', function(){
  showScreen('title');
});

// Service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
